<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Door Prize Griyo Dhahar Kaca5</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f9f9f9, #eaeaea);
      padding: 20px;
    }

    .container {
      max-width: 420px;
      margin: auto;
    }

    .card {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      font-weight: 600;
      margin-bottom: 5px;
      display: block;
    }

    .input-box {
      display: flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 8px;
      background: #fafafa;
    }

    .input-box.error {
      border-color: red;
    }

    .input-box i {
      margin-right: 8px;
      color: #999;
    }

    input, select {
      border: none;
      outline: none;
      width: 100%;
      background: transparent;
    }

    .error-text {
      color: red;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff9900, #ff6600);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .success {
      display: none;
      text-align: center;
    }

    .info {
      font-size: 12px;
      text-align: center;
      margin-top: 10px;
      color: #888;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- FORM -->
  <div class="card" id="formBox">
    <h2>🎁 Door Prize Griyo Dhahar Kaca5</h2>

    <form onsubmit="kirimWA(); return false;">

      <!-- NAMA -->
      <div class="form-group">
        <label>Nama</label>
        <div class="input-box" id="boxNama">
          <i class="fa fa-user"></i>
          <input type="text" id="nama">
        </div>
        <div class="error-text" id="errNama">Nama hanya boleh huruf</div>
      </div>

      <!-- WA -->
      <div class="form-group">
        <label>No WhatsApp</label>
        <div class="input-box" id="boxWA">
          <i class="fa fa-phone"></i>
          <input type="text" id="wa" placeholder="08xxxxxxxxxx">
        </div>
        <div class="error-text" id="errWA">Hanya angka diperbolehkan</div>
      </div>

      <!-- PLATFORM -->
      <div class="form-group">
        <label>Media Sosial</label>
        <div class="input-box">
          <i class="fa fa-share-alt"></i>
          <select id="platform">
            <option value="instagram">Instagram</option>
            <option value="tiktok">TikTok</option>
          </select>
        </div>
      </div>

      <!-- USERNAME -->
      <div class="form-group">
        <label>Username</label>
        <div class="input-box" id="boxUser">
          <i class="fa fa-at"></i>
          <input type="text" id="username">
        </div>
        <div class="error-text" id="errUser">Username wajib diisi</div>
      </div>

      <button type="submit">Kirim Data</button>
    </form>

    <div class="info">Data akan disimpan & dikirim ke admin</div>
  </div>

  <!-- SUCCESS -->
  <div class="card success" id="successBox">
    <h3>✅ Data berhasil dikirim!</h3>
    <p>WhatsApp sudah dibuka 👍</p>
  </div>

</div>

<script>
function kirimWA() {
  let nama = document.getElementById("nama").value.trim();
  let wa = document.getElementById("wa").value.trim();
  let username = document.getElementById("username").value.trim();
  let platform = document.getElementById("platform").value;

  // RESET ERROR
  document.querySelectorAll(".input-box").forEach(e => e.classList.remove("error"));
  document.querySelectorAll(".error-text").forEach(e => e.style.display = "none");

  let valid = true;

  // VALIDASI NAMA
  if (!/^[a-zA-Z\s]+$/.test(nama)) {
    document.getElementById("boxNama").classList.add("error");
    document.getElementById("errNama").style.display = "block";
    valid = false;
  }

  // VALIDASI WA
  if (wa && !/^[0-9]+$/.test(wa)) {
    document.getElementById("boxWA").classList.add("error");
    document.getElementById("errWA").style.display = "block";
    valid = false;
  }

  // VALIDASI USERNAME
  if (!username) {
    document.getElementById("boxUser").classList.add("error");
    document.getElementById("errUser").style.display = "block";
    valid = false;
  }

  if (!valid) return;

  // FORMAT WA
  if (wa.startsWith("0")) {
    wa = "62" + wa.substring(1);
  }

  username = username.replace("@", "");

  let link = platform === "instagram"
    ? "https://instagram.com/" + username
    : "https://www.tiktok.com/@" + username;

  let pesan = `Halo Admin 👋
Saya sudah daftar door prize 🎁

Nama: ${nama}
WhatsApp: ${wa || '-'}
${platform}: ${link}

👉 Join grup:
https://chat.whatsapp.com/LAgsZZI5o4dGZYTeHcOHsh`;

  let waLink = `https://wa.me/6282116677330?text=${encodeURIComponent(pesan)}`;

  // SUCCESS UI
  document.getElementById("formBox").style.display = "none";
  document.getElementById("successBox").style.display = "block";

  // WA (WAJIB DI ATAS)
  window.open(waLink, "_blank");

  // KIRIM KE SHEET
  setTimeout(() => {
    fetch("https://script.google.com/macros/s/AKfycbz3W4wW3c9a6lCdBeko6piMbKb6I_LKgwPbJ0SNzXLprhaLj1GuV9rbOoeD-elzz_L5/exec", {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams({
        nama, wa, platform, username, link
      })
    });
  }, 300);
}
</script>

</body>
</html>
